<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game portrait example</title><link rel="stylesheet" href="../studio.css"><script defer src="../src/portrait-kit.js"></script><script defer src="../src/numeric-portrait.js"></script><script defer src="game-profile.js"></script></head>
<body><header><a class="brand" href="../index.html">PORTRAIT LIBRARY</a><nav><a href="../index.html">Full creator</a></nav></header><main><p class="eyebrow">MINIMAL JAVASCRIPT GAME EXAMPLE</p><h1>A reusable character picture.</h1><p>This page loads a style pack, chooses components, creates a portrait image and keeps the appearance separate from the game's character record.</p><div id="profile" class="example-profile"><img id="avatar" alt="Character portrait"><div><h2 id="name"></h2><p>Ready for the next chapter.</p></div></div><button id="change-hair">Change hairstyle</button><button id="change-face">Change face</button><button id="change-eyes">Change eyes</button><button id="change-nose">Change nose</button><button id="change-mouth">Change mouth</button><button id="change-clothing">Change clothing</button><label>Job backdrop <select id="job"><option value="101">Medic</option><option value="102">Engineer</option><option value="103">Analyst</option></select></label><button id="save">Save appearance</button><button id="load">Load appearance</button><p id="status" role="status">Loading…</p><pre id="appearance" style="white-space:pre-wrap;font-size:12px"></pre></main></body></html>
